<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your life, in numbers</title>
<meta name="description" content="Type your date of birth and see your life in weeks, your heartbeats so far, and how far you have travelled around the Sun. Everything is worked out in your browser." />
<meta property="og:title" content="Your life, in numbers" />
<meta property="og:description" content="Your life in weeks, your heartbeats so far, and how far you have travelled around the Sun." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1120'/><rect x='20' y='24' width='16' height='16' rx='3' fill='%2338bdf8'/><rect x='42' y='24' width='16' height='16' rx='3' fill='%2338bdf8'/><rect x='64' y='24' width='16' height='16' rx='3' fill='%231e2b45'/><rect x='20' y='46' width='16' height='16' rx='3' fill='%231e2b45'/><rect x='42' y='46' width='16' height='16' rx='3' fill='%231e2b45'/><rect x='64' y='46' width='16' height='16' rx='3' fill='%231e2b45'/></svg>" />
</head>
<body>
  <header class="topbar">
    <span class="mark" aria-hidden="true"></span>
    <div class="langs" role="group" aria-label="Language">
      <button class="lang is-active" data-lang="en">EN</button>
      <button class="lang" data-lang="tr">TR</button>
    </div>
  </header>

  <main>
    <section class="intro" id="intro">
      <h1 data-i18n="app.title"></h1>
      <p class="subtitle" data-i18n="app.subtitle"></p>

      <form class="ask" id="form" autocomplete="off">
        <label for="birth" data-i18n="form.label"></label>
        <div class="ask-row">
          <input id="birth" type="date" required />
          <button type="submit" class="btn" data-i18n="form.button"></button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <section class="result" id="result" hidden>
      <div class="headline">
        <div class="headline-main">
          <b id="years">0</b><span data-i18n="headline.years"></span>
        </div>
        <div class="headline-sub">
          <b id="days">0</b><span data-i18n="headline.days"></span>
          <span class="born"><span data-i18n="headline.born"></span> <b id="born-day"></b></span>
        </div>
      </div>

      <div class="panel grid-panel">
        <div class="panel-head">
          <h2 data-i18n="grid.title"></h2>
          <p data-i18n="grid.caption"></p>
        </div>
        <canvas id="grid" width="1040" height="1570" aria-label="Your life in weeks"></canvas>
        <div class="grid-legend">
          <span><i class="sq sq-lived"></i><b id="weeks-lived">0</b> <span data-i18n="grid.lived"></span></span>
          <span><i class="sq sq-left"></i><b id="weeks-left">0</b> <span data-i18n="grid.left"></span></span>
        </div>
      </div>

      <h2 class="section-title" data-i18n="stats.title"></h2>
      <div class="stats" id="stats"></div>

      <div class="two-up">
        <div class="panel">
          <h2 data-i18n="planets.title"></h2>
          <ul class="planets" id="planets"></ul>
        </div>
        <div class="panel">
          <h2 data-i18n="next.title"></h2>
          <ul class="next" id="next"></ul>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="download" data-i18n="card.download"></button>
        <button class="btn" id="again" data-i18n="form.again"></button>
      </div>
      <p class="hint" data-i18n="card.hint"></p>

      <p class="note" id="note-estimates"></p>
    </section>
  </main>

  <footer>
    <p>
      <span data-i18n="note.privacy"></span>
      <a href="https://github.com/ProBurakElci/lifecard" target="_blank" rel="noopener" data-i18n="footer.source"></a>
    </p>
  </footer>

  <canvas id="card-canvas" width="1080" height="1350" hidden></canvas>

  <script src="js/i18n.js"></script>
  <script src="js/life.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
